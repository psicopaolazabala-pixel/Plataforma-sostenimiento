<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contraseña - Portal SENA</title>
    <link rel="stylesheet" href="/public/css/styles.css">
</head>
<body style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background-color: #f4f7f6; margin: 0;">

    <div class="card" style="width: 100%; max-width: 400px; padding: 2rem; border-top: 5px solid #0076A8;">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <h2 style="color: #0076A8; margin: 0;">🔐 Nueva Contraseña</h2>
            <p style="color: #666; font-size: 0.9rem; margin-top: 0.5rem;">Ingresa tu nueva clave de acceso al portal.</p>
        </div>

        <form id="form-restablecer" style="max-width: 340px; margin: 0 auto;">
            <div style="margin-bottom: 1rem; position: relative;">
                <label for="nueva-password" style="display: block; margin-bottom: 0.3rem; font-weight: bold; font-size: 0.85rem; color: #333;">Nueva Contraseña:</label>
                <div style="position: relative; display: flex; align-items: center;">
                    <input type="password" id="nueva-password" placeholder="Mínimo 6 caracteres" minlength="6" required 
                           style="width: 100%; padding: 0.5rem 2rem 0.5rem 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 0.9rem;">
                    <button type="button" class="btn-toggle-password" data-target="nueva-password" 
                            style="position: absolute; right: 8px; background: none; border: none; cursor: pointer; font-size: 1rem; padding: 0; z-index: 5; line-height: 1; user-select: none;">
                        👁️
                    </button>
                </div>
            </div>

            <div style="margin-bottom: 1.2rem; position: relative;">
                <label for="confirmar-password" style="display: block; margin-bottom: 0.3rem; font-weight: bold; font-size: 0.85rem; color: #333;">Confirmar Contraseña:</label>
                <div style="position: relative; display: flex; align-items: center;">
                    <input type="password" id="confirmar-password" placeholder="Repite tu contraseña" minlength="6" required 
                           style="width: 100%; padding: 0.5rem 2rem 0.5rem 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 0.9rem;">
                    <button type="button" class="btn-toggle-password" data-target="confirmar-password" 
                            style="position: absolute; right: 8px; background: none; border: none; cursor: pointer; font-size: 1rem; padding: 0; z-index: 5; line-height: 1; user-select: none;">
                        👁️
                    </button>
                </div>
            </div>

            <button type="submit" id="btn-submit-password" class="btn" 
                    style="width: 100%; background-color: #0076A8; color: white; padding: 0.6rem; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; font-size: 0.95rem;">
                Actualizar Contraseña
            </button>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.btn-toggle-password').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation(); // Evita que el input interfiera con el evento

                    const inputId = btn.getAttribute('data-target');
                    const inputField = document.getElementById(inputId);

                    if (inputField.type === 'password') {
                        inputField.type = 'text';
                        btn.innerText = '🙈';
                    } else {
                        inputField.type = 'password';
                        btn.innerText = '👁️';
                    }
                });
            });
        });
    </script>

    <script type="module">
        import { API } from '/public/js/api.js';

        document.getElementById('form-restablecer').addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('nueva-password').value;
            const confirmar = document.getElementById('confirmar-password').value;
            const btnSubmit = document.getElementById('btn-submit-password');

            console.log("\n==================================================");
            console.log("🚀 [FRONTEND] Botón presionado. Verificando campos...");

            if (password !== confirmar) {
                alert("❌ Las contraseñas no coinciden. Verifica e intenta de nuevo.");
                return;
            }

            btnSubmit.innerText = "⏳ Sincronizando con Supabase...";
            btnSubmit.disabled = true;

            // Capturar parámetros de la URL
            const urlParams = new URLSearchParams(window.location.search);
            const tokenControl = urlParams.get('token'); 
            
            console.log("🕵️‍♂️ [FRONTEND] Token extraído de la barra de direcciones:", tokenControl);

            if (!tokenControl) {
                alert("❌ Error de Seguridad:\nNo se detectó ningún token en la barra de direcciones. Vuelve a abrir el enlace desde tu correo.");
                btnSubmit.innerText = "Actualizar Contraseña";
                btnSubmit.disabled = false;
                console.log("==================================================\n");
                return;
            }

            try {
                console.log("🌐 [FRONTEND] Despachando JSON por fetch mediante api.js...");

                const res = await API.request('/auth/update-password', {
                    method: 'POST',
                    body: { 
                        token: tokenControl,
                        password: password 
                    }
                });

                console.log("📥 [FRONTEND] Respuesta procesada recibida del backend:", res);

                // Forzamos la visualización en pantalla de lo que sea que devuelva la API
                if (res && res.error) {
                    console.error("❌ [FRONTEND] El backend rechazó la petición:", res.error);
                    alert(`❌ Servidor Rechazó el Cambio:\n${res.error}`);
                } else if (res && res.message) {
                    console.log("🎉 [FRONTEND] Éxito absoluto confirmado.");
                    alert(`🎉 ¡Operación Exitosa!\n\n${res.message}\nYa puedes iniciar sesión con tu nueva clave.`);
                    window.location.href = '/index.html'; 
                } else {
                    // Caso excepcional: Respuesta vacía sin estructura estándar
                    console.warn("⚠️ [FRONTEND] Respuesta recibida pero sin formato estandar .error o .message:", res);
                    alert("🎉 Contraseña procesada (Verifica ingresando al Login).");
                    window.location.href = '/index.html';
                }

            } catch (err) {
                console.error("💥 [FRONTEND ERROR CAPTURADO EN CATCH]:", err);
                alert(`❌ Error Crítico en la Petición:\n${err.message || 'Fallo de conexión o el servidor devolvió un texto plano HTML en vez de JSON.'}`);
            } finally {
                btnSubmit.innerText = "Actualizar Contraseña";
                btnSubmit.disabled = false;
                console.log("==================================================\n");
            }
        });
    </script>
</body>
</html>
